<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TimeTable Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .forgot-password {
            margin-top: 20px;
            font-size: 14px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }

        .demo-credentials h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .demo-credentials p {
            margin: 2px 0;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>TimeTable Generator</h1>
            <p>Login Portal</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userId">ID</label>
                <input type="text" id="userId" name="userId" placeholder="Enter your ID" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div id="errorMessage" class="error-message"></div>

        <div class="forgot-password">
            <a href="#" onclick="alert('Please contact your administrator to reset your password.')">Forgot Password?</a>
        </div>

        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <p><strong>Student ID:</strong> 2024001</p>
            <p><strong>Student Password:</strong> demo123</p>
            <p><strong>Faculty ID:</strong> F001</p>
            <p><strong>Faculty Password:</strong> faculty123</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const role = document.getElementById('role').value;
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous error
            errorMessage.style.display = 'none';
            
            // Simple validation (in a real app, this would be server-side)
            if (role === 'student' && userId === '2024001' && password === 'demo123') {
                // Store login info in sessionStorage for the main app
                sessionStorage.setItem('loggedInUserId', userId);
                sessionStorage.setItem('loggedInRole', 'student');
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to the main timetable page
                window.location.href = 'index.html';
            } else if (role === 'faculty' && userId === 'F001' && password === 'faculty123') {
                // Store login info in sessionStorage for faculty
                sessionStorage.setItem('loggedInUserId', userId);
                sessionStorage.setItem('loggedInRole', 'faculty');
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to faculty dashboard
                window.location.href = 'faculty-dashboard.html';
            } else {
                errorMessage.textContent = 'Invalid credentials. Please try again.';
                errorMessage.style.display = 'block';
                
                // Clear password field
                document.getElementById('password').value = '';
            }
        }

        // Check if user is already logged in
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                const role = sessionStorage.getItem('loggedInRole');
                if (role === 'student') {
                    window.location.href = 'index.html';
                } else if (role === 'faculty') {
                    window.location.href = 'faculty-dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
